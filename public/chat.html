<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pine Chat</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="icon" href="/images/logo.png" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      background-color: #0a111d;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      width: 600px;
      height: 500px;
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .sidebar {
      width: 200px;
      background-color: rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 8px;
      position: relative;
    }

    .sidebar.hidden {
      display: none;
    }

    .sidebar-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      background-color: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.1s ease;
      text-align: left;
      position: relative;
      display: flex;
    }

    .sidebar-btn:hover {
      background-color: rgba(255, 255, 255, 0.14);
    }

    .sidebar-btn.active {
      background-color: rgba(59, 130, 246, 0.8);
      color: white;
    }

    .create-dm-btn {
      background-color: rgba(255, 255, 255, 0.08);
      color: white;
      text-align: left;
    }

    .create-dm-btn:hover {
      background-color: rgba(255, 255, 255, 0.14);
    }

    .dm-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }

    .dm-btn {
      padding: 6px 10px;
      border: none;
      border-radius: 3px;
      background-color: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.1s ease;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .dm-btn:hover {
      background-color: rgba(255, 255, 255, 0.12);
    }

    .dm-btn.active {
      background-color: rgba(99, 102, 241, 0.8);
      color: white;
    }

    .dm-btn-content {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .unread-indicator {
      background-color: white;
      color: #0a111d;
      border-radius: 50%;
      min-width: 16px;
      height: 16px;
      font-size: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .dm-close {
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      font-size: 10px;
      padding: 2px 4px;
      border-radius: 2px;
      margin-left: 4px;
    }

    .dm-close:hover {
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .username-setup {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      width: 100%;
    }

    .title-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      text-align: left;
      gap: 20px;
      padding: 20px;
    }

    .title-section h1 {
      color: rgba(255, 255, 255, 0.95);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-align: left;
    }

    .rules-container {
      position: absolute;
      top: 65px;
      left: 20px;
      right: 20px;
    }

    .rules {
      text-align: left;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      line-height: 1.5;
      background-color: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
    }

    .rules h3 {
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .input-section {
      background-color: rgba(255, 255, 255, 0.05);
      padding: 10px;
      flex-shrink: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .input-row {
      display: flex;
      gap: 5px;
      align-items: stretch;
      margin-bottom: 8px;
    }

    .username-input {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 3px;
      background-color: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      outline: none;
      transition: all 0.1s ease;
    }

    .username-input:focus {
      background-color: rgba(255, 255, 255, 0.15);
    }

    .username-btn {
      padding: 8px 15px;
      border: none;
      border-radius: 3px;
      background-color: rgba(59, 130, 246, 0.8);
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .username-btn:hover:not(:disabled) {
      background-color: rgba(59, 130, 246, 1);
    }

    .username-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-space {
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-header {
      padding: 12px 15px;
      background-color: rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chat-title {
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
    }

    .current-user {
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      font-weight: 500;
    }

    .messages {
      position: absolute;
      top: 53px;
      bottom: 75px;
      left: 0;
      right: 0;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }

    .messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    .message-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 8px;
    }

    .message-group.own {
      align-items: flex-end;
    }

    .username-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 2px;
      margin-left: 8px;
    }

    .message {
      padding: 6px 10px;
      border-radius: 3px;
      word-wrap: break-word;
      animation: messageAppear 0.1s ease;
      transition: all 0.1s ease;
      font-size: 13px;
      width: fit-content;
      max-width: 80%;
    }

    .message.own {
      background-color: rgba(59, 130, 246, 0.8);
      color: white;
    }

    .message.other {
      background-color: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.9);
    }

    .system-message {
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
      font-style: italic;
      margin: 4px 0;
      animation: messageAppear 0.1s ease;
    }

    @keyframes messageAppear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-input-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.05);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .message-input-form {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
    }

    .message-input {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 3px;
      background-color: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      outline: none;
      transition: all 0.1s ease;
    }

    .message-input:focus {
      background-color: rgba(255, 255, 255, 0.15);
    }

    .send-btn {
      padding: 8px 15px;
      border: none;
      border-radius: 3px;
      background-color: rgba(59, 130, 246, 0.8);
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .send-btn:hover:not(:disabled) {
      background-color: rgba(59, 130, 246, 1);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-message {
      color: rgba(239, 68, 68, 0.9);
      font-size: 12px;
      text-align: center;
      opacity: 0;
      animation: errorAppear 0.1s ease forwards;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes errorAppear {
      to {
        opacity: 1;
      }
    }

    .hidden {
      display: none;
    }

    .mention {
      background-color: rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      padding: 1px 3px;
      border-radius: 3px;
      font-weight: 500;
    }

    .ping-indicator {
      background-color: #ef4444;
      color: white;
      border-radius: 50%;
      min-width: 16px;
      height: 16px;
      font-size: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      position: absolute;
      top: -2px;
      right: -8px;
    }

    .online-count {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      cursor: default;
      user-select: none;
    }

    .online-tooltip {
      position: absolute;
      bottom: 18px;
      left: -1.5px;
      background-color: rgba(255, 255, 255, 0.07);
      color: rgba(255, 255, 255, 0.9);
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 10px;
      white-space: pre-line;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: 0.15s ease;
      z-index: 1000;
      max-width: 180px;
      transform: scale(0.9);
    }

    .online-count:hover .online-tooltip {
      visibility: visible;
      opacity: 1;
      transform: scale(1);
    }

    .password-input {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 3px;
      background-color: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      outline: none;
      transition: all 0.1s ease;
      display: none;
    }

    .password-input:focus {
      background-color: rgba(255, 255, 255, 0.15);
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 8px 16px;
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <button class="back-btn" onclick="window.location.href='/'">← Back to Pine</button>
  
  <div class="app-container">
    <div id="sidebar" class="sidebar hidden">
      <button id="main-chat-btn" class="sidebar-btn active">
        Public Chat
      </button>
      <button id="create-dm-btn" class="sidebar-btn create-dm-btn">
        + New DM
      </button>
      <div id="dm-list" class="dm-list"></div>
      <div id="online-count" class="online-count">
        0 online
        <div id="online-tooltip" class="online-tooltip"></div>
      </div>
    </div>

    <div class="chat-container">
      <div id="username-setup" class="username-setup">
        <div class="title-section">
          <div class="rules-container">
            <div class="rules">
              <h3>Pine Chat</h3>
              <p>Welcome to Pine Chat! Chat with other Pine users in real-time. Create an account with a username and password to get started. Your username is protected and only you can use it with your password.</p>
            </div>
          </div>
          <h1>PINE CHAT</h1>
        </div>

        <div class="input-section">
          <div class="input-row">
            <input type="text" id="username-input" class="username-input" placeholder="Enter your username"
              maxlength="20" />
            <input type="password" id="password-input" class="password-input" placeholder="Enter your password"
              maxlength="100" />
            <button id="username-btn" class="username-btn">
              Login
            </button>
          </div>
          <div class="error-space">
            <div id="username-error" class="error-message"></div>
          </div>
        </div>
      </div>

      <div id="chat-interface" class="hidden">
        <div class="chat-header">
          <div class="chat-title" id="chat-title">
            Public Chat
          </div>
          <div class="current-user" id="current-user"></div>
        </div>

        <div id="messages" class="messages"></div>

        <div class="message-input-container">
          <form id="message-form" class="message-input-form">
            <input type="text" id="message-input" class="message-input" placeholder="Message everyone..."
              maxlength="500" />
            <button type="submit" id="send-btn" class="send-btn">
              Send
            </button>
          </form>
          <div id="message-error" class="error-message"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/chat.js"></script>
</body>
</html>
